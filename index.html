<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#070b14">

  <title>DESSENJER</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================
       AUTH SCREEN
  ========================== -->

  <div id="authScreen" class="auth-screen">

    <div class="auth-card">

      <div class="auth-logo">D</div>

      <h1>DESSENJER</h1>

      <p class="auth-subtitle">
        Secure. Fast. Connected.
      </p>

      <div class="auth-tabs">

        <button
          id="loginTab"
          class="active"
          type="button"
        >
          Login
        </button>

        <button
          id="registerTab"
          type="button"
        >
          Register
        </button>

      </div>

      <form id="authForm">

        <input
          id="usernameInput"
          type="text"
          placeholder="Username"
          autocomplete="username"
          hidden
        >

        <input
          id="emailInput"
          type="email"
          placeholder="Email"
          autocomplete="email"
          required
        >

        <input
          id="passwordInput"
          type="password"
          placeholder="Password"
          autocomplete="current-password"
          minlength="6"
          required
        >

        <button
          id="authButton"
          type="submit"
        >
          Login
        </button>

      </form>

      <p id="authMessage"></p>

    </div>

  </div>


  <!-- =========================
       MAIN APPLICATION
  ========================== -->

  <div
    class="app"
    id="app"
    hidden
  >

    <!-- LEFT SIDEBAR -->

    <aside class="sidebar">

      <div class="brand">

        <div class="logo">
          D
        </div>

        <span>
          DESSENJER
        </span>

      </div>


      <div class="search">

        <input
          id="searchInput"
          type="search"
          placeholder="Search..."
          autocomplete="off"
        >

      </div>


      <div class="section-title">
        CHATS
      </div>


      <div id="chatList">

        <div
          class="chat active"
          data-name="Alex"
        >

          <div class="avatar">
            A
          </div>

          <div class="chat-info">

            <strong>
              Alex
            </strong>

            <span>
              Hey 👋
            </span>

          </div>

        </div>


        <div
          class="chat"
          data-name="Jasur"
        >

          <div class="avatar">
            J
          </div>

          <div class="chat-info">

            <strong>
              Jasur
            </strong>

            <span>
              See you later
            </span>

          </div>

        </div>


        <div
          class="chat"
          data-name="Madina"
        >

          <div class="avatar">
            M
          </div>

          <div class="chat-info">

            <strong>
              Madina
            </strong>

            <span>
              New message
            </span>

          </div>

        </div>

      </div>


      <!-- PROFILE -->

      <div class="profile">

        <div
          class="avatar"
          id="profileAvatar"
        >
          D
        </div>

        <div class="profile-info">

          <strong id="profileName">
            User
          </strong>

          <span class="online">
            ● Online
          </span>

        </div>

        <button
          id="logoutButton"
          type="button"
          title="Logout"
        >
          ⏻
        </button>

      </div>

    </aside>


    <!-- MAIN CHAT -->

    <main class="chat-window">

      <header class="chat-header">

        <div>

          <h2 id="chatTitle">
            Alex
          </h2>

          <span class="status">
            ● Online
          </span>

        </div>


        <div class="header-actions">

          <button
            type="button"
            title="Search"
          >
            🔍
          </button>

          <button
            type="button"
            title="Call"
          >
            📞
          </button>

          <button
            type="button"
            title="More"
          >
            ⋮
          </button>

        </div>

      </header>


      <!-- MESSAGES -->

      <section
        class="messages"
        id="messages"
      >

        <div class="message received">

          <div class="avatar">
            A
          </div>

          <div>

            <strong>
              Alex
            </strong>

            <p>
              Hey! Welcome to DESSENJER 👋
            </p>

            <small>
              21:40
            </small>

          </div>

        </div>

      </section>


      <!-- MESSAGE INPUT -->

      <footer class="message-input">

        <button
          class="attach"
          id="attachButton"
          type="button"
        >
          ＋
        </button>


        <input
          id="messageInput"
          type="text"
          placeholder="Write a message..."
          autocomplete="off"
          maxlength="2000"
        >


        <button
          id="sendButton"
          type="button"
        >
          ➤
        </button>

      </footer>

    </main>


    <!-- RIGHT SIDEBAR -->

    <aside class="members">

      <h3>
        ONLINE
      </h3>


      <div class="member">

        <div class="avatar">
          A
        </div>

        <span>
          Alex
        </span>

        <i></i>

      </div>


      <div class="member">

        <div class="avatar">
          J
        </div>

        <span>
          Jasur
        </span>

        <i></i>

      </div>


      <div class="member">

        <div class="avatar">
          M
        </div>

        <span>
          Madina
        </span>

        <i></i>

      </div>

    </aside>

  </div>


  <!-- =========================
       SUPABASE
       FALLBACK CDN
  ========================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Agar jsDelivr ishlamasa, brauzer konsolida ko‘rinadi -->

  <!-- =========================
       DESSENJER API
  ========================== -->

  <script src="./api/api.js"></script>

  <!-- =========================
       DESSENJER APP
  ========================== -->

  <script src="./js/app.js"></script>

</body>
</html>
